<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلن ممیزی تبلیغات</title>
<style>
:root{--purple:#6d4aff;--purple2:#8c6cff;--ink:#18213b;--muted:#7a8299;--bg:#f6f4ff;--card:#fff;--line:#ece8fb;--red:#ef4444;--orange:#f59e0b;--yellow:#eab308;--green:#22c55e}
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 12% 15%,#e8f5ff 0,transparent 28%),radial-gradient(circle at 88% 82%,#eee8ff 0,transparent 30%),linear-gradient(135deg,#fbfdff,#f7f5ff);color:var(--ink);min-height:100vh}
body.drawer-open .page{filter:blur(4px);transform:scale(.995);pointer-events:none;user-select:none}
.page{transition:.2s ease;min-height:100vh}
.topbar{max-width:1220px;margin:auto;padding:26px 28px 10px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:13px} .logo{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #d9cffd;box-shadow:0 8px 22px #6d4aff22}
.brand h1{font-size:24px;margin:0 0 6px} .brand p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;align-items:center} .icon-btn{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px #332a5d0b;position:relative;font-size:21px}
.badge{position:absolute;top:-5px;left:-5px;background:#ef4444;color:#fff;min-width:21px;height:21px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:bold;border:2px solid #fff}
.back{text-decoration:none;color:#5e48ca;font-size:13px;font-weight:bold;padding:12px 14px;border-radius:12px;background:#f1edff}
.hero{max-width:1220px;margin:10px auto 18px;padding:0 28px} .hero-card{background:linear-gradient(120deg,#6d4aff,#8d6df7);color:#fff;border-radius:24px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;box-shadow:0 18px 45px #6d4aff2b}
.hero h2{margin:0 0 8px;font-size:22px} .hero p{margin:0;color:#eeeaff;font-size:13px;line-height:2} .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end} .stat{min-width:92px;text-align:center;background:#ffffff18;border:1px solid #ffffff2d;padding:10px 13px;border-radius:16px} .stat b{display:block;font-size:20px} .stat span{font-size:11px;color:#f4f0ff}
.toolbar{max-width:1220px;margin:0 auto 16px;padding:0 28px;display:flex;gap:10px;align-items:center} .search{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;outline:none} .filter{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font:inherit;color:#555}
.grid{max-width:1220px;margin:auto;padding:0 28px 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.task{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #34286a0b;cursor:pointer;transition:.18s ease;position:relative;overflow:hidden} .task:hover{transform:translateY(-2px);box-shadow:0 14px 34px #4d3d8d15;border-color:#dcd2ff} .task::before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:#7c5cff}
.task-head{display:flex;align-items:flex-start;gap:12px} .num{width:42px;height:42px;border-radius:13px;background:#f0ecff;color:#6749e8;display:grid;place-items:center;font-weight:bold;flex:0 0 auto} .task-title{font-size:14px;line-height:1.9;font-weight:bold;flex:1} .score{font-size:11px;color:#7157d7;background:#f3efff;padding:6px 8px;border-radius:9px;white-space:nowrap}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 54px 12px 0} .pill{font-size:11px;color:#626a7d;background:#f7f8fb;padding:7px 9px;border-radius:9px} .pill.due{background:#fff7e8;color:#9a6300} .pill.owner{background:#f7f7f7;color:#8b8b8b}
.progress-track{height:9px;background:#f0f1f5;border-radius:999px;overflow:hidden;margin-top:10px} .progress-fill{height:100%;width:0;border-radius:999px;transition:.25s} .progress-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:11px} .progress-row b{font-size:13px;color:var(--ink)}
.notif-panel{position:fixed;top:82px;left:max(22px,calc((100vw - 1220px)/2 + 28px));width:min(390px,calc(100vw - 44px));background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 55px #251a5c28;z-index:40;padding:15px;display:none} .notif-panel.show{display:block} .notif-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0edf8;padding:2px 3px 12px;margin-bottom:8px} .notif-title b{font-size:14px} .notif-list{max-height:390px;overflow:auto} .notice{padding:11px 9px;border-bottom:1px solid #f5f2fb} .notice:last-child{border:0} .notice b{font-size:12px;display:block;margin-bottom:5px} .notice span{font-size:11px;color:var(--muted);line-height:1.8}
.overlay{position:fixed;inset:0;background:#17203a55;z-index:80;display:none} .overlay.show{display:block} .drawer{position:fixed;z-index:90;top:0;left:0;height:100vh;width:min(720px,94vw);background:#fbfbfe;box-shadow:20px 0 70px #10162b3d;transform:translateX(-105%);transition:.28s ease;display:flex;flex-direction:column} .drawer.show{transform:translateX(0)} .drawer-head{padding:22px 22px 16px;background:#fff;border-bottom:1px solid var(--line)} .drawer-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start} .close{border:0;background:#f3f1f8;width:38px;height:38px;border-radius:12px;font-size:22px;cursor:pointer} .drawer h3{margin:0;font-size:17px;line-height:1.9} .drawer-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .drawer-body{overflow:auto;padding:15px 20px 35px}
.sub{background:#fff;border:1px solid #ece9f5;border-radius:16px;padding:15px;margin-bottom:11px} .sub-title{font-size:12px;line-height:2;color:#2f374c;margin-bottom:12px} .sub-top{display:flex;justify-content:space-between;gap:8px;color:#8a90a0;font-size:10px;margin-bottom:8px} input[type=range]{width:100%;accent-color:#7c5cff;cursor:pointer} .sub-pct{text-align:center;font-weight:bold;font-size:13px;margin-top:6px} .stages{display:flex;justify-content:space-between;gap:6px;margin-top:9px;font-size:9px;color:#a0a4b0} .stage-active{color:#6d4aff;font-weight:bold}
.empty{text-align:center;color:#999;padding:30px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.hero-card{grid-template-columns:1fr}.stats{justify-content:flex-start}.topbar,.hero,.toolbar,.grid{padding-left:16px;padding-right:16px}.brand h1{font-size:19px}.logo{width:46px;height:46px}}
</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="brand"><img class="logo" src="audit.png.png" alt="ممیزی تبلیغات"><div><h1>پلن ممیزی تبلیغات</h1><p>مدیریت و پایش پیشرفت تسک‌ها و ریزتسک‌ها</p></div></div>
  <div class="actions"><a class="back" href="index.html">بازگشت به واحدها</a><button class="icon-btn" id="bell" title="اعلان‌ها">🔔<span class="badge" id="badge">0</span></button></div>

<section class="hero"><div class="hero-card"><div><h2>پلن ممیزی تبلیغات</h2><p>اطلاعات این صفحه بر اساس فایل پلن واحد ممیزی تبلیغات بارگذاری شده است.</p></div><div class="stats"><div class="stat"><b>23</b><span>تسک</span></div><div class="stat"><b>144</b><span>ریزتسک</span></div><div class="stat"><b id="overall">0٪</b><span>پیشرفت کل</span></div></div></div></section>

</div>

<script>
const TASKS=[{"num": 1, "title": "اجرای ممیزی هفتگی هزینه‌ها و پرداخت‌های تبلیغاتی و ثبت مغایرت‌های مستند", "score": 1800, "duration": "هفتگی", "subtasks": ["تعیین دامنه هزینه‌ها و پرداخت‌های مشمول ممیزی و مسیر دریافت داده رسمی با تأیید آقای مدنی؛ تحویل فهرست منابع و مسئول ارائه هر منبع.", "توافق با واحد مالی بر قالب هفتگی داده شامل شناسه اجرا، طرف معامله، مبلغ، مالیات، تاریخ و وضعیت پرداخت؛ دریافت نخستین خروجی قابل تطبیق.", "تطبیق شناسه و اقلام هزینه در منابع مالی، تبلیغات و پنل؛ ثبت موارد فاقد شناسه یا دارای اختلاف مبلغ و مالیات.", "رسیدگی هفتگی به تطابق مبلغ صورتحساب، هزینه ثبت‌شده، پرداخت و مجوز مرتبط؛ ثبت نتیجه هر بررسی در مرجع موجود ممیزی.", "کنترل هزینه‌های ثبت‌نشده، تکراری، فاقد پشتوانه و منتسب به عاملیت یا اجرای نادرست؛ مستندسازی یافته‌ها بدون تکرار بازمحاسبه تعرفه در تسک ۱۰.", "دریافت پاسخ و مدارک تکمیلی از واحد مسئول و ثبت نتیجه تطبیق مجدد یا ارجاع موارد حل‌نشده.", "ارجاع یافته‌های دارای نیاز به اصلاح به بانک یکپارچه پرونده‌های تسک ۴ با همان شناسه؛ تحویل فهرست موارد و مدارک رسیدگی.", "تحویل گزارش هفتگی یافته‌های مالی به آقای مدنی و دریافت تأیید واحد مالی درباره ارقام رسمی مورد استفاده."]}, {"num": 2, "title": "اجرای ممیزی هفتگی بودجه‌های تبلیغاتی و کنترل مجوز تغییرات هزینه", "score": 1500, "duration": "هفتگی", "subtasks": ["دریافت نسخه معتبر بودجه‌های مصوب و مجوزهای بودجه مازاد با تأیید مرجع مجاز، از جمله آقای ایمانی؛ ثبت تاریخ اثر هر نسخه.", "استخراج خلأهای اجرایی مقررات بودجه عاملیت‌های جدید یا آزمایشی و تهیه صرفاً بندهای تکمیلی لازم؛ اخذ تأیید آقای مدنی و تصویب مرجع مجاز.", "تطبیق هفتگی مصرف هر بودجه با سقف و مجوز معتبر همان دوره و ثبت انحراف مستند در مرجع ممیزی.", "شناسایی تغییر هزینه پس از نهایی‌شدن بودجه و کنترل درخواست، علت، مرجع تصویب و اثر مالی تغییر؛ تحویل فهرست تغییرات بررسی‌شده.", "تدوین نیاز کسب‌وکاری گردش تغییر هزینه و ثبت ردپای تغییر شامل کاربر، زمان و مقدار قبل و بعد؛ ارسال درخواست رسمی به IT.", "توافق بر معیار پذیرش و اجرای آزمون گردش و ردپای تغییر پس از تحویل نسخه فنی قابل آزمون IT؛ ثبت نسخه، نتیجه آزمون و درخواست رفع نقص. کنترل هفتگی مج const STORAGE_KEY='seasonal-plan-audit-progress-v1';
let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function key(ti,si){return `${ti}-${si}`}
function pct(t){if(!t.subtasks.length)return 0;return Math.round(t.subtasks.reduce((a,_,i)=>a+(state[key(t.num,i)]||0),0)/t.subtasks.length)}
function color(p){return p<=20?'var(--red)':p<=40?'var(--orange)':p<=80?'var(--yellow)':'var(--green)'}
function status(p){return p===0?'شروع نشده':p<100?'درحال انجام':'بارگذاری مستندات در میزیتو'}
function render(){
 const q=document.getElementById('search').value.trim(); const f=document.getElementById('filter').value;
 const grid=document.getElementById('grid'); grid.innerHTML='';
 const list=TASKS.filter(t=>(!q||t.title.includes(q))&&(f==='all'||t.duration===f||(f==='date'&&t.duration!=='هفتگی'&&t.duration!=='ماهانه')));
 list.forEach(t=>{const p=pct(t);const el=document.createElement('article');el.className='task';el.innerHTML=`
 <div class="task-head"><div class="num">${t.num}</div><div class="task-title">${esc(t.title)}</div><div class="score">${Number(t.score||0).toLocaleString('fa-IR')} امتیاز</div></div>
 <div class="meta"><span class="pill due">⏰ ${esc(t.duration)}</span><span class="pill">ریزتسک: ${t.subtasks.length.toLocaleString('fa-IR')}</span><span class="pill owner">مسئول: —</span></div>
 <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${color(p)}"></div></div><div class="progress-row"><span>${status(p)}</span><b>${p.toLocaleString('fa-IR')}٪</b></div>`;el.onclick=()=>openTask(t);grid.appendChild(el)});
 if(!list.length)grid.innerHTML='<div class="empty">تسکی با این فیلتر پیدا نشد.</div>';
 updateOverall(); updateNotifications();
}
function openTask(t){document.body.classList.add('drawer-open');document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('show');document.getElementById('drawerTitle').textContent=`تسک ${t.num} — ${t.title}`;document.getElementById('drawerMeta').innerHTML=`<span class="pill due">⏰ ${esc(t.duration)}</span><span class="pill">${Number(t.score||0).toLocaleString('fa-IR')} امتیاز</span><span class="pill owner">مسئول: —</span>`;const body=document.getElementById('drawerBody');body.innerHTML='';t.subtasks.forEach((s,i)=>{const v=state[key(t.num,i)]||0;const d=document.createElement('div');d.className='sub';d.innerHTML=`<div class="sub-top"><span>ریزتسک ${i+1}</span><span>مسئول: —</span></div><div class="sub-title">${esc(s)}</div><input type="range" min="0" max="100" step="10" value="${v}" data-k="${key(t.num,i)}"><div class="sub-pct" style="color:${color(v)}">${v.toLocaleString('fa-IR')}٪</div><div class="stages"><span class="${v===0?'stage-active':''}">شروع نشده</span><span class="${v>0&&v<100?'stage-active':''}">درحال انجام</span><span class="${v===100?'stage-active':''}">بارگذاری مستندات در میزیتو</span></div>`;body.appendChild(d);const r=d.querySelector('input');r.oninput=e=>{const val=+e.target.value;state[e.target.dataset.k]=val;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));d.querySelector('.sub-pct').textContent=val.toLocaleString('fa-IR')+'٪';d.querySelector('.sub-pct').style.color=color(val);d.querySelectorAll('.stages span').forEach(x=>x.classList.remove('stage-active'));d.querySelectorAll('.stages span')[val===0?0:val===100?2:1].classList.add('stage-active');render();}})}
function closeDrawer(){document.body.classList.remove('drawer-open');document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show')}
function updateOverall(){const all=TASKS.map(pct);const o=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):0;document.getElementById('overall').textContent=o.toLocaleString('fa-IR')+'٪'}
function updateNotifications(){const items=[];TASKS.forEach(t=>{const p=pct(t);if(p<100)items.push({n:t.num,title:t.title,msg:`پیشرفت ${p.toLocaleString('fa-IR')}٪ — موعد/تناوب: ${t.duration}`})});document.getElementById('badge').textContent=items.length.toLocaleString('fa-IR');document.getElementById('notifCount').textContent=items.length.toLocaleString('fa-IR')+' مورد';document.getElementById('notifList').innerHTML=items.slice(0,20).map(x=>`<div class="notice"><b>تسک ${x.n} — ${esc(x.title)}</b><span>${esc(x.msg)}</span></div>`).join('')+(items.length>20?`<div class="notice"><span>${(items.length-20).toLocaleString('fa-IR')} اعلان دیگر نیز وجود دارد.</span></div>`:'')}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('close').onclick=closeDrawer;document.getElementById('overlay').onclick=closeDrawer;document.getElementById('bell').onclick=e=>{e.stopPropagation();document.getElementById('notifPanel').classList.toggle('show')};document.addEventListener('click',e=>{if(!document.getElementById('notifPanel').contains(e.target)&&!document.getElementById('bell').contains(e.target))document.getElementById('notifPanel').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});render();
</script>
